name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build for prod
        run: ./scripts/buildprod.sh
      
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      
      - name: Push Docker image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/total-palisade-495314-v6/notely-ar-repo/notely:latest .
      
      - name: Migrate database
        run: ./scripts/migrateup.sh

      - name: Deploy to Cloud run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/total-palisade-495314-v6/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project total-palisade-495314-v6 --max-instances=4
