name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Build for prod
        run: ./scripts/buildprod.sh
      
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      
      - name: Push Docker image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/total-palisade-495314-v6/notely-ar-repo/notely:latest .
